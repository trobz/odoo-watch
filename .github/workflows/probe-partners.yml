name: Verify watch fix
on:
  push:
    branches: [fix-partner-country]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 watch.py --only data/odoo_partners_vietnam.txt
      - name: Inspect result
        run: |
          echo "lines=$(wc -l < data/odoo_partners_vietnam.txt)"
          echo "vn_lines=$(grep -c 'country_id=232' data/odoo_partners_vietnam.txt)"
          echo "non_vn=$(grep -vc 'country_id=232' data/odoo_partners_vietnam.txt || true)"
          head -3 data/odoo_partners_vietnam.txt
          echo "--- diff vs committed:"
          git diff --stat data/
